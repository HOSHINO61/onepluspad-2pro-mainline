#
# Ubuntu's iio-sensor-proxy is built without libssc. Run the private build
# with SSC support instead; the distribution unit, D-Bus policy and polkit
# action stay in force and nothing Ubuntu ships is replaced.
[Unit]
# Never publish the accelerometer merely because the DSP node exists.
Requires=erhai-sensors-gate.service
After=erhai-sensors-gate.service

[Service]
ExecStart=
ExecStart=/usr/lib/erhai/sensors/libexec/iio-sensor-proxy
# libssc speaks QMI over QRTR; the allow list is merged with the unit's own.
RestrictAddressFamilies=AF_QIPCRTR
# Absent unless erhai-sensors-ssc-delivery selected a stream delivery for
# this boot; without it libssc keeps its own wake-up delivery.
EnvironmentFile=-/run/erhai-sensors-ssc/env
