#
# Internal speaker playback: CANDIDATE, NOT ENABLED.
#
# HiFi.conf does not include this file, so no playback device is offered and
# desktop sound is never routed to the amplifiers. Enable it only after both:
#   1. the silent DSP acceptance test of the speaker path has passed on the
#      installed kernel and topology, and
#   2. a listening check has confirmed the slot positions below at low volume.
# Then add this line at the end of HiFi.conf (after the "Mic" device):
#   Include.speaker.File "/Qualcomm/sm8750/OnePlus-Pad-2-Pro/Speaker.conf"
#
# The MultiMedia1 playback PCM (device 0) carries the eight 32-bit, 48 kHz
# TDM slots unchanged; the DSP graph does no channel mixing. The route PCM
# below reproduces the mixing of the original firmware's speaker graph
# (8x2 channel mixer: left on even slots, right on odd slots):
#
#   slot 0  Amp0  left, top       slot 1  Amp1  right, bottom
#   slot 2  Amp2  left, bottom    slot 3  Amp3  right, top
#   slot 4  no amplifier          slot 5  Amp5  right, high
#   slot 6  Amp6  left, high      slot 7  no amplifier
#
# Left/right follows the original mixer and mixer paths; top/bottom/high are
# the original test labels and still need a listening check. The original
# graph also has vendor speaker protection and tuning, which this path lacks:
# keep loudness limited. Amplifier gain and profile are left to the stored
# mixer state until acoustic acceptance fixes them.

LibraryConfig.erhai_speaker.Config.pcm.erhai_speaker {
	@args [ CARD DEV ]
	@args {
		CARD.type string
		DEV.type integer
	}
	type route
	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}
		format S32_LE
		channels 8
	}
	ttable {
		0.0 1
		0.2 1
		0.4 1
		0.6 1
		1.1 1
		1.3 1
		1.5 1
		1.7 1
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"
	EnableSequence [
		cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 1,1"
	]
	DisableSequence [
		cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 0,0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "erhai_speaker:${CardId},0"
		PlaybackChannels 2
	}
}
