# SPDX-License-Identifier: BSD-3-Clause
SectionVerb {
	EnableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"
	EnableSequence [
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC4 MUX' CH4_AMIC5"
		cset "name='TX0 MODE' ADC_HIFI"
		cset "name='TX3 MODE' ADC_HIFI"
		cset "name='ADC1 Volume' 0"
		cset "name='ADC4 Volume' 0"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX SMIC MUX1' SWR_MIC3"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='DEC1 MODE' ADC_DEFAULT"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_DEC1 Volume' 84"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}

# Internal speakers: a candidate, off unless enabled for the running boot.
# erhai-audio-speaker enable creates the flag below -- in /run, so every boot
# starts without it -- and restarts the users' sound servers, which read this
# file again; disable removes it. See Speaker.conf for the levels it sets.
If.speaker {
	Condition {
		Type Path
		Path "/run/erhai-audio/speaker-enabled"
		Mode exist
	}
	True.Include.speaker.File "/Qualcomm/sm8750/OnePlus-Pad-2-Pro/Speaker.conf"
}
