# erhai stopgap, paired with 90_erhai-power-stopgap.gschema.override.
#
# On mainline this tablet has no working suspend/resume: a suspend blanks the
# panel for good and only a long power-key press brings the device back, and
# the idle blank does not wake on touch either (TECH-DEBT D19/D23). Until PSCI
# suspend/resume and the wake path work, nothing may put the machine to sleep
# on its own -- not the power key, not the lid, not the idle timer.
#
# Remove this file (and unmask sleep.target) once suspend works.
[Login]
HandlePowerKey=ignore
HandleLidSwitch=ignore
IdleAction=ignore
