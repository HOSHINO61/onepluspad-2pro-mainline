# erhai: who owns the power key on this tablet.
#
# logind's own default for the power key is to power the machine off. On a
# tablet whose only buttons are power and volume that is the wrong answer to a
# press meant to wake the screen, and it is the answer the greeter would give
# before anybody has logged in, where GNOME is not yet holding an inhibitor.
# So logind stands aside and GNOME decides: the session's
# power-button-action is "interactive", which puts a dialog on the screen and
# lets a deliberate press suspend the tablet and an accidental one be
# cancelled.
#
# There is no lid on this machine. The magnetic keyboard does not power up yet
# (TECH-DEBT D13), and when it does, a keyboard folio closing is not a reason
# to put the tablet to sleep behind the user's back.
[Login]
HandlePowerKey=ignore
HandleLidSwitch=ignore
