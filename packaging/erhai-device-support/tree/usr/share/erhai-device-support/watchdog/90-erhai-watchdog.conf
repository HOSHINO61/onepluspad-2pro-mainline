# Opt-in hardware watchdog for the OnePlus Pad 2 Pro (erhai). Installed as
# /etc/systemd/system.conf.d/90-erhai-watchdog.conf it replaces the packaged
# default of the same name in /usr/lib/systemd/system.conf.d, which leaves
# the watchdog off.
#
# 30 seconds is inside the Gunyah watchdog's 32 second limit, and systemd
# pets it every 15. It fires only when PID 1 cannot run for 30 seconds: a
# kernel or PID 1 hard lockup. It changes nothing for a system that is
# running but failing; the bounded recovery of test sessions (erhai.session)
# and the one-shot cold-boot check still decide when such a system goes back
# to the bootloader.
#
# RebootWatchdogSec covers the last stage of a reboot or power-off, after the
# services have stopped, while systemd-shutdown detaches file systems and the
# kernel resets. systemd's 10min default does not fit this hardware; 30s does.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=30s
