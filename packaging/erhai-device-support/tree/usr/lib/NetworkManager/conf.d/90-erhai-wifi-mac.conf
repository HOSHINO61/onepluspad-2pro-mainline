#
# Keep the MAC address the tablet was given.
#
# 81-erhai-wifi-address.rules sets this unit's own address on the radio before
# NetworkManager ever sees the interface.  NetworkManager would then be free to
# replace it when it activates a connection: cloned-mac-address=permanent puts
# back whatever the driver reports as permanent, which here is the address the
# firmware invented this boot -- the one the whole exercise is about getting
# rid of.  "preserve" means leave the interface with the address it already
# has, which is the one that was injected.
#
# NetworkManager's own default for this is already "preserve", so on a stock
# Ubuntu this file changes nothing.  It is here because the difference between
# "the default happens to suit us" and "we asked for this" is a distribution
# deciding otherwise in some later release, and the failure would be quiet: the
# tablet would simply go back to a new identity at every boot.
#
# A connection profile that sets 802-11-wireless.cloned-mac-address itself
# still wins over this, as it should -- someone who asks a particular network
# for a random or stable-per-SSID address means it.
#
# Scan randomisation (wifi.scan-rand-mac-address) is deliberately not set here.
# It only affects the address in probe requests while scanning, not the one the
# interface associates with, so it does not touch DHCP reservations or MAC
# filtering; Ubuntu already turns it off in NetworkManager.conf, and that is
# the administrator's call rather than this port's.

[connection-erhai-wifi-mac]
match-device=type:wifi
wifi.cloned-mac-address=preserve
