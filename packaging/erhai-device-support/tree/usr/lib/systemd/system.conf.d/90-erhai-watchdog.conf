# Hardware watchdog policy for the OnePlus Pad 2 Pro (erhai): off by default.
#
# The kernel's Gunyah watchdog (/dev/watchdog0, identity "Gunyah Watchdog")
# accepts timeouts of 1 to 32 seconds and has no pretimeout. The driver keeps
# it stopped until something opens the device, and with this file nothing
# does:
#
#  - RuntimeWatchdogSec=off is systemd's own default, stated here so that the
#    opt-in below is a change of this one file.
#  - RebootWatchdogSec=off replaces systemd's 10min default, which is longer
#    than this hardware can hold. Rather than depend on how systemd treats a
#    rejected timeout in the middle of a reboot, the reboot path stays as it
#    was before the kernel had a watchdog.
#
# To have systemd pet the watchdog, so that a kernel or PID 1 hard lockup
# resets the tablet within 30 seconds, install the opt-in variant over this
# file under the same name and re-execute the manager:
#
#   install -D -m 0644 /usr/share/erhai-device-support/watchdog/90-erhai-watchdog.conf \
#       /etc/systemd/system.conf.d/90-erhai-watchdog.conf
#   systemctl daemon-reexec
#
# Removing the /etc copy and re-executing again goes back to this file. For a
# single boot, the kernel command line option systemd.watchdog_sec=30 sets
# the runtime and reboot timeouts alike without writing to the root file
# system.
[Manager]
RuntimeWatchdogSec=off
RebootWatchdogSec=off
