#
# Follow time zone changes for the Wi-Fi regulatory country. The time zone is
# the /etc/localtime symlink, which a path unit cannot watch: inotify follows
# the link to the zone file, and a new zone replaces the link without touching
# that file. Settings, first-run setup and timedatectl all change the zone
# through timedated, which exits about 30 seconds after its last request.
[Service]
ExecStopPost=-+/usr/bin/systemctl --no-block start erhai-wifi-country.service
